<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCDF Supply — Operations</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;--bg4:#232840;
  --border:#2a2f42;--border2:#353b52;
  --text:#e2e6f0;--muted:#6b7394;--muted2:#4a5070;
  --accent:#4f7cff;--accent2:#3d63d4;
  --success:#2ecc8a;--warn:#f0a500;--danger:#e05555;--info:#38bdf8;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;height:100vh;display:flex;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:210px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.logo{padding:20px 16px 14px;border-bottom:1px solid var(--border);}
.logo-main{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.04em;}
.logo-sub{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.06em;text-transform:uppercase;}
.nav{padding:12px 8px;flex:1;overflow-y:auto;}
.nav-section{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);padding:10px 10px 4px;margin-top:4px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px;transition:all .15s;margin-bottom:1px;user-select:none;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:var(--bg3);color:var(--accent);border-left:2px solid var(--accent);padding-left:8px;}
.nav-icon{width:14px;height:14px;flex-shrink:0;}
.nav-badge{margin-left:auto;color:white;font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:10px;}
.nb-warn{background:var(--warn);color:#000;}
.nb-danger{background:var(--danger);}
.nb-info{background:var(--accent);}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);}
.cycle-name{font-family:var(--mono);font-size:10px;color:var(--accent);margin-top:3px;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:52px;border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:12px;background:var(--bg2);flex-shrink:0;}
.topbar-title{font-size:14px;font-weight:500;}
.topbar-sep{width:1px;height:18px;background:var(--border);}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center;}

/* BUTTONS */
.btn{padding:6px 14px;border-radius:6px;font-size:12px;font-family:var(--sans);cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text);transition:all .15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:white;}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2);color:white;}
.btn-success{background:transparent;border-color:var(--success);color:var(--success);}
.btn-success:hover{background:var(--success);color:#000;}
.btn-danger{border-color:var(--danger);color:var(--danger);}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn-xs{padding:2px 8px;font-size:10px;}

/* PAGE */
.page{flex:1;overflow-y:auto;padding:20px;display:none;}
.page.active{display:block;}
.page::-webkit-scrollbar{width:4px;}
.page::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
.stat-n{font-family:var(--mono);font-size:22px;font-weight:500;}
.stat-l{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em;}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono);}

/* SECTION HEADER */
.sec-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.sec-title{font-size:13px;font-weight:500;}
.sec-spacer{flex:1;}

/* TABLE */
.tbl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:8px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);border-bottom:1px solid var(--border);text-align:left;font-weight:400;background:var(--bg);}
.tbl th.r{text-align:right;}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--bg3);cursor:pointer;}
.tbl-empty{text-align:center;padding:32px!important;color:var(--muted)!important;font-size:12px!important;}

/* PILLS / BADGES */
.pill{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;display:inline-block;}
.pill-active{background:rgba(46,204,138,.12);color:var(--success);}
.pill-pending{background:rgba(240,165,0,.12);color:var(--warn);}
.pill-danger{background:rgba(224,85,85,.12);color:var(--danger);}
.pill-info{background:rgba(79,124,255,.12);color:var(--accent);}
.pill-muted{background:var(--bg3);color:var(--muted);}
.mat-maize{background:rgba(250,200,120,.12);color:#FAC875;}
.mat-dorb{background:rgba(95,200,160,.12);color:#5DCAA5;}
.mat-doms{background:rgba(175,169,236,.12);color:#AFA9EC;}
.mat-rice{background:rgba(56,189,248,.12);color:var(--info);}

/* PROGRESS */
.prog-wrap{display:flex;flex-direction:column;gap:3px;min-width:120px;}
.prog-bar{height:4px;background:var(--border);border-radius:3px;overflow:hidden;position:relative;}
.prog-fill{height:100%;border-radius:3px;}
.prog-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);}

/* DETAIL PANEL (bills) */
.split-layout{display:flex;gap:0;height:100%;overflow:hidden;}
.split-list{width:360px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:var(--bg2);}
.split-detail{flex:1;overflow-y:auto;}
.split-list::-webkit-scrollbar,.split-detail::-webkit-scrollbar{width:4px;}
.split-list::-webkit-scrollbar-thumb,.split-detail::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.bill-card{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.bill-card:hover{background:var(--bg3);}
.bill-card.selected{background:var(--bg3);border-left:2px solid var(--accent);}
.bc-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.bc-id{font-family:var(--mono);font-size:11px;color:var(--muted);}
.bc-broker{font-size:13px;font-weight:500;margin-bottom:3px;}
.bc-meta{display:flex;gap:10px;font-size:11px;color:var(--muted);font-family:var(--mono);}
.bc-src{font-size:10px;color:var(--muted2);margin-top:3px;display:flex;align-items:center;gap:4px;}
.src-dot{width:6px;height:6px;border-radius:50%;}
.src-tg{background:#2aabee;}
.src-web{background:var(--accent);}

/* DETAIL SECTIONS */
.detail-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg2);position:sticky;top:0;z-index:10;}
.detail-body{padding:18px;display:flex;flex-direction:column;gap:16px;}
.section-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.section-head{padding:9px 14px;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:8px;}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.field-row{padding:10px 14px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
.field-row:nth-child(even){border-right:none;}
.field-row:nth-last-child(-n+2){border-bottom:none;}
.field-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px;}
.field-input{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:6px 9px;font-family:var(--mono);font-size:12px;color:var(--text);width:100%;outline:none;transition:border .15s;}
.field-input:focus{border-color:var(--accent);}
.field-input.err{border-color:var(--danger);}
.field-sel{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:6px 9px;font-family:var(--mono);font-size:12px;color:var(--text);width:100%;outline:none;}
.val-row{padding:8px 14px;display:flex;flex-direction:column;gap:5px;}
.val-item{display:flex;align-items:center;gap:8px;font-size:12px;}
.val-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.val-ok{background:var(--success);}
.val-fail{background:var(--danger);}
.val-warn{background:var(--warn);}
.val-text{color:var(--muted);}
.val-text.fail{color:var(--danger);}
.val-right{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted2);}
.conf-bar-wrap{display:flex;align-items:center;gap:6px;margin-left:auto;}
.conf-bar{width:70px;height:4px;background:var(--border);border-radius:3px;overflow:hidden;}
.conf-fill{height:100%;border-radius:3px;}

/* DEAL LINKER */
.deal-opt{padding:9px 12px;border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .15s;display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.deal-opt:hover{border-color:var(--accent);}
.deal-opt.linked{border-color:var(--success);background:rgba(46,204,138,.06);}
.deal-radio{width:14px;height:14px;border-radius:50%;border:1px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.deal-opt.linked .deal-radio{background:var(--success);border-color:var(--success);}
.deal-radio-dot{width:6px;height:6px;border-radius:50%;background:white;display:none;}
.deal-opt.linked .deal-radio-dot{display:block;}
.deal-fill-bar{width:56px;height:4px;background:var(--border);border-radius:2px;margin-bottom:2px;}
.deal-fill-inner{height:100%;border-radius:2px;background:var(--accent);}

/* ALERT BAR */
.alert-bar{background:rgba(224,85,85,.1);border:1px solid rgba(224,85,85,.25);border-radius:8px;padding:9px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:12px;}
.alert-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex-shrink:0;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* TENDER BLOCK */
.tender-block{background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;}
.tender-header{padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);}
.tender-header:hover{background:var(--bg3);}
.th-caret{font-size:10px;color:var(--muted);transition:transform .2s;}
.th-caret.open{transform:rotate(90deg);}

/* FORM / MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:520px;max-height:80vh;overflow-y:auto;}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:500;}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:12px;}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.form-input{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:7px 10px;font-family:var(--mono);font-size:12px;color:var(--text);width:100%;outline:none;}
.form-input:focus{border-color:var(--accent);}
.form-select{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:7px 10px;font-family:var(--sans);font-size:12px;color:var(--text);width:100%;outline:none;}

/* BILL MOCK PREVIEW */
.bill-mock{background:#fff;border-radius:4px;padding:14px;font-family:var(--mono);font-size:10px;color:#222;line-height:1.7;max-width:300px;}
.bill-mock.hw{transform:rotate(-.5deg);font-family:cursive;background:#fffef5;}
.bm-head{text-align:center;font-weight:500;border-bottom:1px solid #ddd;padding-bottom:6px;margin-bottom:8px;font-size:11px;}
.bm-row{display:flex;justify-content:space-between;}
.bm-total{border-top:1px solid #ddd;margin-top:6px;padding-top:6px;font-weight:500;display:flex;justify-content:space-between;}

/* UPLOAD ZONE */
.upload-zone{border:1px dashed var(--border2);border-radius:8px;padding:32px;text-align:center;cursor:pointer;transition:border-color .2s;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);}
.upload-zone-icon{font-size:24px;margin-bottom:8px;}

/* NUM MONO */
.num{font-family:var(--mono);font-size:12px;}
.num.r{text-align:right;}
.num.ok{color:var(--success);}
.num.warn{color:var(--warn);}
.num.danger{color:var(--danger);}
.num.muted{color:var(--muted);}
.num.info{color:var(--info);}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--text);display:none;z-index:999;max-width:320px;}
.toast.show{display:block;}
.toast.t-ok{border-color:var(--success);color:var(--success);}
.toast.t-err{border-color:var(--danger);color:var(--danger);}

/* CHART */
.chart-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.chart-bar-label{min-width:90px;font-size:12px;color:var(--muted);}
.chart-bar-track{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden;}
.chart-bar-fill{height:100%;border-radius:5px;transition:width .4s;}
.chart-bar-val{min-width:60px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--muted);font-size:13px;}
.loading::after{content:'';width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-left:10px;}
@keyframes spin{to{transform:rotate(360deg)}}

input[type=number]::-webkit-inner-spin-button{opacity:.5;}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">
    <div class="logo-main">RCDF Supply</div>
    <div class="logo-sub">Operations Platform</div>
  </div>
  <nav class="nav">
    <div class="nav-section">Overview</div>
    <div class="nav-item active" onclick="nav('dashboard',this)">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
      Dashboard
    </div>

    <div class="nav-section">Procurement</div>
    <div class="nav-item" onclick="nav('tenders',this)">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12v9a1 1 0 01-1 1H3a1 1 0 01-1-1V4z"/><path d="M5 4V2.5a.5.5 0 01.5-.5h5a.5.5 0 01.5.5V4"/></svg>
      Tenders
    </div>
    <div class="nav-item" onclick="nav('deals',this)">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12V4l4 4 3-5 3 4 2-3v8H2z"/></svg>
      Deals
    </div>

    <div class="nav-section">Operations</div>
    <div class="nav-item" onclick="nav('bills',this)">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><line x1="5" y1="6" x2="11" y2="6"/><line x1="5" y1="9" x2="9" y2="9"/></svg>
      Bill Review
      <span class="nav-badge nb-warn" id="nb-bills">0</span>
    </div>
    <div class="nav-item" onclick="nav('dispatch',this)">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="7" width="10" height="7" rx="1"/><path d="M11 9l3-2v6l-3-2"/></svg>
      Dispatch
    </div>

    <div class="nav-section">Finance</div>
    <div class="nav-item" onclick="nav('purchase-bills',this)">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h12v10H2z"/><line x1="5" y1="7" x2="11" y2="7"/><line x1="5" y1="10" x2="8" y2="10"/></svg>
      Purchase Bills
    </div>
    <div class="nav-item" onclick="nav('sales-bills',this)">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h12v10H2z"/><line x1="5" y1="7" x2="11" y2="7"/><path d="M8 10l2 2 3-3"/></svg>
      Sales Bills
    </div>
    <div class="nav-item" onclick="nav('payments',this)">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4" width="14" height="9" rx="1.5"/><line x1="1" y1="7" x2="15" y2="7"/></svg>
      Payments
    </div>

    <div class="nav-section">Intelligence</div>
    <div class="nav-item" onclick="nav('market',this)">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="1,12 5,7 8,9 12,4 15,6"/></svg>
      Market Prices
    </div>
    <div class="nav-item" onclick="nav('reports',this)">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
      Reports
    </div>
    <div class="nav-item" onclick="nav('brokers',this)">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="5" r="3"/><path d="M1 14c0-3 2.5-5 5-5s5 2 5 5"/><path d="M13 8a2 2 0 100-4"/><path d="M16 14c0-2-1-3.5-3-4"/></svg>
      Brokers
    </div>
  </nav>
  <div class="sidebar-footer">
    <div id="footer-cycle">Loading cycle...</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="page-title">Dashboard</div>
    <div class="topbar-sep"></div>
    <span id="topbar-sub" style="font-size:11px;color:var(--muted)"></span>
    <div class="topbar-right" id="topbar-actions"></div>
  </div>

  <!-- PAGES -->
  <div id="page-dashboard" class="page active" style="overflow-y:auto;"></div>
  <div id="page-tenders" class="page" style="overflow-y:auto;"></div>
  <div id="page-deals" class="page" style="overflow-y:auto;"></div>
  <div id="page-bills" class="page" style="overflow:hidden;height:calc(100vh - 52px);">
    <div class="split-layout" style="height:100%;">
      <div class="split-list" id="bills-list-panel"></div>
      <div class="split-detail" id="bills-detail-panel">
        <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted2);">
          <div style="font-size:13px;font-weight:500">Select a bill to review</div>
          <div style="font-size:11px">Click any bill from the list</div>
        </div>
      </div>
    </div>
  </div>
  <div id="page-dispatch" class="page" style="overflow-y:auto;"></div>
  <div id="page-purchase-bills" class="page" style="overflow-y:auto;"></div>
  <div id="page-sales-bills" class="page" style="overflow-y:auto;"></div>
  <div id="page-payments" class="page" style="overflow-y:auto;"></div>
  <div id="page-market" class="page" style="overflow-y:auto;"></div>
  <div id="page-reports" class="page" style="overflow-y:auto;"></div>
  <div id="page-brokers" class="page" style="overflow-y:auto;"></div>
</div>

<div class="toast" id="toast-el"></div>
<div id="modal-container"></div>

<script>
const API = 'http://localhost:8000/api';

// ── Global state ──────────────────────────────────────────────────────────
let state = {
  plants: [], materials: [], brokers: [], cycles: [],
  currentPage: 'dashboard',

// ── Navigation ─────────────────────────────────────────────────────────────
function nav(page, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  state.currentPage = page;
  const titles = {
    dashboard: 'Dashboard', tenders: 'Tenders', deals: 'Deal Tracker',
    bills: 'Bill Review', dispatch: 'Dispatch Tracking',
    'purchase-bills': 'Purchase Bills', 'sales-bills': 'Sales Bills',
    payments: 'Payments', market: 'Market Prices', reports: 'Reports', brokers: 'Brokers'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  document.getElementById('topbar-actions').innerHTML = '';
  document.getElementById('topbar-sub').textContent = '';
  pages[page]?.load();
}

// ── API helpers ────────────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  try {
    const r = await fetch(API + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    if (!r.ok) {
      const err = await r.text();
      throw new Error(err);
    }
    return await r.json();
  } catch (e) {
    toast(e.message || 'API error', 'err');
    throw e;
  }
}

async function apiPost(path, body) {
  return apiFetch(path, { method: 'POST', body: JSON.stringify(body) });
}

async function apiPatch(path, body = {}) {
  return apiFetch(path, { method: 'PATCH', body: JSON.stringify(body) });
}

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg, type = '') {
  const el = document.getElementById('toast-el');
  el.textContent = msg;
  el.className = `toast show${type ? ' t-' + type : ''}`;
  clearTimeout(window._toast);
  window._toast = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Helpers ────────────────────────────────────────────────────────────────
function matClass(m) {
  return { Maize: 'mat-maize', Dorb: 'mat-dorb', Doms: 'mat-doms', 'Rice DDGS': 'mat-rice' }[m] || '';
}
function barColor(p) {
  return p >= 100 ? 'var(--success)' : p >= 60 ? 'var(--accent)' : p >= 35 ? 'var(--warn)' : 'var(--danger)';
}
function statusPill(s) {
  const map = {
    active: 'pill-active', pending: 'pill-pending', review: 'pill-pending',
    flagged: 'pill-danger', danger: 'pill-danger', at_risk: 'pill-pending',
    penalty_risk: 'pill-danger', done: 'pill-info', complete: 'pill-info',
    approved: 'pill-active', linked: 'pill-info', draft: 'pill-muted',
    confirmed: 'pill-active', paid: 'pill-info', sent: 'pill-active', partial: 'pill-pending',
    in_transit: 'pill-pending',
  };
  return `<span class="pill ${map[s] || 'pill-muted'}">${s?.replace('_', ' ')}</span>`;
}
function fmtAmt(v) { return v ? '₹' + parseFloat(v).toLocaleString('en-IN', { maximumFractionDigits: 0 }) : '—'; }
function fmtMT(v) { return v ? parseFloat(v).toFixed(1) + ' Qtl' : '—'; }
function modal(html) { document.getElementById('modal-container').innerHTML = html; }
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

// ── Load reference data ────────────────────────────────────────────────────
async function loadRef() {
  try {
    [state.plants, state.materials, state.brokers, state.cycles] = await Promise.all([
      apiFetch('/plants'), apiFetch('/materials'), apiFetch('/brokers'), apiFetch('/cycles')
    ]);
    const active = state.cycles.find(c => c.is_active);
    if (active) {
      document.getElementById('footer-cycle').innerHTML =
        `<div>Sproxx cycle</div><div class="cycle-name">${active.name}</div>`;
      document.getElementById('topbar-sub').textContent = active.name;
    }
  } catch {}
}

    const matOpts    = state.materials.map(m=>`<option value="${m.id}" ${m.name===d.material?'selected':''}>${m.name}</option>`).join('');
    modal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head">Edit deal ${d.deal_number} <button class="btn btn-sm" onclick="closeModal()">✕</button></div>
        <div class="modal-body">
          <div class="form-row">
            <div class="form-field"><div class="form-label">Broker</div><select class="form-select" id="de-broker">${brokerOpts}</select></div>
            <div class="form-field"><div class="form-label">Material</div><select class="form-select" id="de-mat">${matOpts}</select></div>
          </div>
          <div class="form-row">
            <div class="form-field"><div class="form-label">Deal qty (MT)</div><input class="form-input" id="de-mt" type="number" value="${d.deal_mt}"></div>
            <div class="form-field"><div class="form-label">Rate (₹/MT)</div><input class="form-input" id="de-rate" type="number" value="${d.rate_per_mt}"></div>
          </div>
          <div class="form-field">
            <div class="form-label">Status</div>
            <select class="form-select" id="de-status">
              ${['active','partial','complete','cancelled'].map(s=>`<option value="${s}" ${d.status===s?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="pages.deals.saveEdit(${id})">Save changes</button>
        </div>
      </div>
    </div>`);
  },

  async saveEdit(id) {
    try {
      await apiFetch(`/deals/${id}`, { method: 'PATCH', body: JSON.stringify({
        broker_id:   parseInt(document.getElementById('de-broker').value),
        material_id: parseInt(document.getElementById('de-mat').value),
        deal_mt:     parseFloat(document.getElementById('de-mt').value),
        rate_per_mt: parseFloat(document.getElementById('de-rate').value),
        status:      document.getElementById('de-status').value,
      })});
      closeModal(); toast('Deal updated', 'ok');
      state.deals = await apiFetch('/deals');
      pages.deals.load();
    } catch {}
  },

  async deleteDeal(id) {
    if (!confirm('Cancel this deal?')) return;
    try {
      await apiFetch(`/deals/${id}`, { method: 'DELETE' });
      toast('Deal cancelled', 'ok');
      state.deals = await apiFetch('/deals');
      pages.deals.load();
    } catch {}
  }
};

// ============================================================
pages.bills = {
  async load() {
    await this.loadList();
    document.getElementById('topbar-actions').innerHTML = `
      <div style="display:flex;gap:6px">
        ${['all','pending','flagged','approved','linked'].map(f=>
          `<button class="btn btn-sm ${state.billFilter===f?'btn-primary':''}" onclick="pages.bills.filter('${f}')">${f}</button>`
        ).join('')}
      </div>
      <label class="btn" style="cursor:pointer">
        + Upload bill
        <input type="file" accept="image/*,.pdf" style="display:none" onchange="pages.bills.upload(this)">
      </label>`;
  },

  async loadList() {
    const el = document.getElementById('bills-list-panel');
    const url = state.billFilter === 'all' ? '/bills' : `/bills?status=${state.billFilter}`;
    try {
      const bills = await apiFetch(url);
      state.bills = bills;
      // Stats bar
      const counts = {};
      bills.forEach(b => { counts[b.status] = (counts[b.status]||0)+1; });
      el.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)">
          ${[['Pending',counts.pending||0,'warn'],['Flagged',counts.flagged||0,'danger'],['Approved',(counts.approved||0)+(counts.linked||0),'ok'],['Bills',bills.length,'info']].map(([l,n,c])=>
            `<div style="padding:10px;border-right:1px solid var(--border)">
              <div class="num ${c}" style="font-size:18px">${n}</div>
              <div style="font-size:10px;color:var(--muted)">${l}</div>
            </div>`).join('')}
        </div>
        <div style="padding:8px 10px;border-bottom:1px solid var(--border)">
          <input style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:6px 10px;color:var(--text);font-size:12px;outline:none"
            placeholder="Search broker, vehicle, material..."
            oninput="pages.bills.search(this.value)">
        </div>
        <div style="padding:6px 10px;border-bottom:1px solid var(--border);font-size:10px;color:var(--muted2);display:flex;justify-content:space-between">
          <span>Bills</span><span>${bills.length} shown</span>
        </div>
        <div id="bills-cards">
          ${bills.length ? bills.map(b => this.billCardHtml(b)).join('') : '<div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">No bills</div>'}
        </div>`;
    } catch {}
  },

  billCardHtml(b) {
    const sel = state.selectedBill?.id === b.id;
    return `<div class="bill-card ${b.status} ${sel?'selected':''}" onclick="pages.bills.select(${b.id})">
      <div class="bc-top">
        <span class="bc-id">${b.id}</span>
        ${statusPill(b.status === 'review' ? 'pending' : b.status)}
      </div>
      <div class="bc-broker">${b.broker_name||'Unknown'}</div>
      <div class="bc-meta">
        <span>${b.material||'—'}</span>
        <span>${fmtMT(b.qty_mt)}</span>
        <span>${b.rate_per_mt?'₹'+parseFloat(b.rate_per_mt).toLocaleString('en-IN'):''}</span>
      </div>
      <div class="bc-src">
        <span class="src-dot ${b.source==='telegram'?'src-tg':'src-web'}"></span>
        ${b.source==='telegram'?'Telegram':'Web'} · ${b.vehicle_number||'<span style="color:var(--danger)">No vehicle</span>'} · ${b.bill_date||'—'}
      </div>
    </div>`;
  },

  async select(id) {
    state.selectedBill = state.bills.find(b => b.id === id);
    // Update list selection
    document.querySelectorAll('.bill-card').forEach(c => c.classList.remove('selected'));
    event?.currentTarget?.classList.add('selected');
    this.renderDetail(state.selectedBill);
  },

  renderDetail(b) {
    const panel = document.getElementById('bills-detail-panel');
    if (!b) return;
    const comp = b.qty_mt && b.rate_per_mt ? b.qty_mt * b.rate_per_mt : null;
    const amtOk = comp && b.total_amount && Math.abs(comp - b.total_amount) / b.total_amount < 0.05;
    const vehOk = b.vehicle_number && /^[A-Z]{2}\d{2}[A-Z]{1,2}\d{4}$/i.test(b.vehicle_number.replace(/\s/g,''));
    const conf  = b.ocr_confidence ? Math.round(b.ocr_confidence * 100) : 0;
    const confColor = conf >= 85 ? 'var(--success)' : conf >= 65 ? 'var(--warn)' : 'var(--danger)';
    const deals = state.deals.filter(d => !b.material || d.material === b.material);

    panel.innerHTML = `
      <div class="detail-header">
        <div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--muted)">Bill #${b.id} · ${b.source}</div>
          <div style="font-size:15px;font-weight:500">${b.broker_name||'Unknown broker'}</div>
        </div>
        <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
          ${b.status==='pending'||b.status==='flagged' ? `<button class="btn btn-sm btn-danger" onclick="pages.bills.reject(${b.id})">Reject</button>` : ''}
          ${b.status!=='approved'&&b.status!=='linked' ? `<button class="btn btn-sm btn-success" onclick="pages.bills.approve(${b.id})">Approve</button>` : ''}
          ${b.status==='approved' ? `<button class="btn btn-sm btn-primary" onclick="pages.bills.exportBusy(${b.id})">Export to Busy</button>` : ''}
          ${b.status==='linked' ? `<span style="color:var(--success);font-size:12px">✓ Linked</span>` : ''}
          <button class="btn btn-xs" onclick="pages.bills.deleteBill(${b.id})" style="border-color:var(--danger);color:var(--danger);margin-left:8px">🗑 Delete</button>
        </div>
      </div>
      <div class="detail-body">

        <div class="section-card">
          <div class="section-head">Bill preview
            <span style="margin-left:auto;font-size:10px;color:${b.is_handwritten?'var(--warn)':'var(--success)'}">
              ${b.is_handwritten?'Handwritten':'Printed'}</span>
          </div>
          <div style="padding:12px;background:var(--bg);display:flex;justify-content:center">
            ${b.image_path
              ? `<img src="/uploads/bills/${b.image_path.split('/').pop()}" style="max-width:320px;max-height:300px;border-radius:4px" onerror="this.replaceWith(document.createTextNode('Image not found'))">`
              : this.mockBillHtml(b)}
          </div>
        </div>

        <div class="section-card">
          <div class="section-head">
            Extracted fields
            <span class="pill ${b.ocr_source==='paddle'?'pill-active':'pill-pending'}" style="font-size:9px">${b.ocr_source||'manual'}</span>
            <div class="conf-bar-wrap">
              <span style="font-size:10px;color:var(--muted)">Confidence</span>
              <div class="conf-bar"><div class="conf-fill" style="width:${conf}%;background:${confColor}"></div></div>
              <span style="font-family:var(--mono);font-size:10px;color:${confColor}">${conf}%</span>
            </div>
          </div>
          <div class="fields-grid">
            ${this.fi('Vendor', 'broker_name', b.broker_name, false)}
            ${this.fi('Vehicle no.', 'vehicle_number', b.vehicle_number||'', !vehOk && b.vehicle_number)}
            ${this.fs('Material', 'material', b.material, state.materials.map(m=>m.name))}
            ${this.fi('Qty (Qtl)', 'qty_mt', b.qty_mt, false, true)}
            ${this.fi('Rate (₹/Qtl)', 'rate_per_mt', b.rate_per_mt, false, true)}
            ${this.fi('Total (₹)', 'total_amount', b.total_amount, !amtOk, true)}
            ${this.fi('Bill date', 'bill_date', b.bill_date, false)}
            ${this.fi('Bill no.', 'bill_number', b.bill_number||'', false)}
            ${this.fs('Plant', 'plant_name', b.plant, state.plants.map(p=>p.name))}
          </div>
          <div style="padding:10px 14px;border-top:1px solid var(--border)">
            <button class="btn btn-primary btn-sm" onclick="pages.bills.saveFields(${b.id})">Save corrections</button>
          </div>
        </div>

        <div class="section-card">
          <div class="section-head">Validation</div>
          <div class="val-row">
            <div class="val-item">
              <div class="val-dot ${amtOk?'val-ok':'val-fail'}"></div>
              <span class="val-text ${amtOk?'':'fail'}">Qty × Rate = Total</span>
              <span class="val-right">${comp?Math.round(comp).toLocaleString('en-IN'):'?'} vs ₹${b.total_amount?parseFloat(b.total_amount).toLocaleString('en-IN'):'?'}</span>
            </div>
            <div class="val-item">
              <div class="val-dot ${vehOk?'val-ok':b.vehicle_number?'val-fail':'val-warn'}"></div>
              <span class="val-text ${!vehOk&&b.vehicle_number?'fail':''}">Vehicle format (RJ XX XX XXXX)</span>
              <span class="val-right">${b.vehicle_number||'missing'}</span>
            </div>
            <div class="val-item">
              <div class="val-dot ${b.material?'val-ok':'val-fail'}"></div>
              <span class="val-text">Known material type</span>
              <span class="val-right">${b.material||'unknown'}</span>
            </div>
          </div>
        </div>

        <div class="section-card">
          <div class="section-head">Link to deal</div>
          <div style="padding:10px 14px">
            ${deals.length ? deals.map(d=>{
              const pct = Math.round(d.accepted_mt/d.deal_mt*100);
              const linked = b.deal_id === d.id;
              return `<div class="deal-opt ${linked?'linked':''}" onclick="pages.bills.linkDeal(${b.id},${d.id})">
                <div class="deal-radio"><div class="deal-radio-dot"></div></div>
                <div style="flex:1">
                  <div style="font-size:12px;font-weight:500">${d.deal_number} — ${d.broker}</div>
                  <div style="font-family:var(--mono);font-size:10px;color:var(--muted)">${d.material} · ${d.deal_mt - d.accepted_mt} MT remaining</div>
                </div>
                <div style="text-align:right">
                  <div class="deal-fill-bar"><div class="deal-fill-inner" style="width:${pct}%"></div></div>
                  <div style="font-family:var(--mono);font-size:9px;color:var(--muted)">${pct}% filled</div>
                </div>
              </div>`;
            }).join('') : '<div style="font-size:12px;color:var(--muted)">No matching deals. Create a deal first.</div>'}
          </div>
        </div>
      </div>`;
  },

  mockBillHtml(b) {
    return `<div class="bill-mock ${b.is_handwritten?'hw':''}">
      <div class="bm-head">${b.broker_name||'?'}</div>
      <div class="bm-row"><span>Material:</span><span>${b.material||'?'}</span></div>
      <div class="bm-row"><span>Qty:</span><span>${b.qty_mt||'?'} MT</span></div>
      <div class="bm-row"><span>Rate:</span><span>₹${b.rate_per_mt||'?'}/MT</span></div>
      <div class="bm-row"><span>Vehicle:</span><span>${b.vehicle_number||'?'}</span></div>
      <div class="bm-row"><span>Date:</span><span>${b.bill_date||'?'}</span></div>
      <div class="bm-total"><span>Total</span><span>${fmtAmt(b.total_amount)}</span></div>
      <div style="margin-top:8px;font-size:8px;text-align:center;color:#aaa">[${b.is_handwritten?'Handwritten':'Printed'} · OCR: ${b.ocr_source||'—'}]</div>
    </div>`;
  },

  fi(label, key, val, isErr, isMono = false) {
    return `<div class="field-row">
      <div class="field-label">${label}</div>
      <input class="field-input ${isErr?'err':''}" data-key="${key}" value="${val??''}"
        type="${isMono?'number':'text'}" step="${isMono?'0.01':'any'}" style="${isMono?'font-family:var(--mono)':''}">
    </div>`;
  },

  fs(label, key, val, opts) {
    const o = opts.map(op=>`<option ${op===val?'selected':''}>${op}</option>`).join('');
    return `<div class="field-row">
      <div class="field-label">${label}</div>
      <select class="field-sel" data-key="${key}"><option value="">— select —</option>${o}</select>
    </div>`;
  },

  async saveFields(billId) {
    const updates = {};
    document.querySelectorAll('[data-key]').forEach(el => {
      const k = el.dataset.key;
      if (['qty_mt','rate_per_mt','total_amount'].includes(k)) updates[k] = parseFloat(el.value)||null;
      else if (k === 'broker_name') updates.broker_name = el.value;
      else updates[k] = el.value || null;
    });
    try {
      const updated = await apiFetch(`/bills/${billId}`, { method: 'PATCH', body: JSON.stringify(updates) });
      state.selectedBill = updated;
      state.bills = state.bills.map(b => b.id === billId ? updated : b);
      this.renderDetail(updated);
      toast('Fields saved', 'ok');
    } catch {}
  },

  async approve(id) {
    try {
      const updated = await apiFetch(`/bills/${id}/approve`, { method: 'PATCH' });
      state.selectedBill = updated;
      state.bills = state.bills.map(b => b.id === id ? updated : b);
      this.renderDetail(updated);
      this.refreshCards();
      toast('Bill approved', 'ok');
    } catch {}
  },

  async reject(id) {
    try {
      const updated = await apiFetch(`/bills/${id}`, { method: 'PATCH', body: JSON.stringify({ status: 'flagged' }) });
      state.selectedBill = updated;
      state.bills = state.bills.map(b => b.id === id ? updated : b);
      this.renderDetail(updated);
      this.refreshCards();
      toast('Bill flagged');
    } catch {}
  },

  async linkDeal(billId, dealId) {
    try {
      const updated = await apiFetch(`/bills/${billId}/link/${dealId}`, { method: 'PATCH' });
      state.selectedBill = updated;
      state.bills = state.bills.map(b => b.id === billId ? updated : b);
      this.renderDetail(updated);
      toast('Linked to deal', 'ok');
    } catch {}
  },

  exportBusy(id) {
    toast('Generating Busy export...', 'ok');
  },

  async upload(input) {
    const file = input.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    fd.append('source', 'web');
    try {
      toast('Uploading and processing with OCR...');
      const r = await fetch(`${API}/bills/upload`, { method: 'POST', body: fd });
      const bill = await r.json();
      state.bills.unshift(bill);
      this.loadList();
      this.select(bill.id);
      toast('Bill processed', 'ok');
    } catch (e) { toast('Upload failed: ' + e.message, 'err'); }
  },

  filter(f) {
    state.billFilter = f;
    this.load();
  },

  search(q) {
    const ql = q.toLowerCase();
    document.querySelectorAll('.bill-card').forEach((card, i) => {
      const b = state.bills[i];
      const match = !ql || [b?.broker_name, b?.material, b?.vehicle_number, b?.plant].some(v => v?.toLowerCase().includes(ql));
      card.style.display = match ? '' : 'none';
    });
  },

  refreshCards() {
    const container = document.getElementById('bills-cards');
    if (container) container.innerHTML = state.bills.map(b => this.billCardHtml(b)).join('');
  },

  async deleteBill(id) {
    if (!confirm('Permanently delete this bill?')) return;
    try {
      await apiFetch(`/bills/${id}`, { method: 'DELETE' });
      state.bills = state.bills.filter(b => b.id !== id);
      state.selectedBill = null;
      document.getElementById('bills-detail-panel').innerHTML = `
        <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted2);">
          <div style="font-size:13px">Bill deleted</div>
        </div>`;
      this.refreshCards();
      toast('Bill deleted', 'ok');
    } catch {}
  }
};

              <td class="num r ok">${d.accepted_mt??'—'}</td>

            </tr>`).join('')}

  },

    modal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head">Record plant receipt <button class="btn btn-sm" onclick="closeModal()">✕</button></div>

      plant_id:       parseInt(document.getElementById('rc-plant').value),

      rejected_mt:    parseFloat(document.getElementById('rc-rej').value)||0,
      rejection_reason: document.getElementById('rc-reason').value||null,

      await apiPost('/receipts', body);
      closeModal(); toast('Receipt saved', 'ok');

  openDispatch() {

    const deals = state.deals.map(d=>`<option value="${d.id}">${d.deal_number} — ${d.broker} (${d.deal_mt} Qtl)</option>`).join('');
    modal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head">Record dispatch <button class="btn btn-sm" onclick="closeModal()">✕</button></div>
        <div class="modal-body">
          <div class="form-row">
            <div class="form-field"><div class="form-label">Vehicle number</div><input class="form-input" id="dc-veh"></div>

            <div class="form-field"><div class="form-label">Qty (Qtl)</div><input class="form-input" type="number" id="dc-qty" step="0.01"></div>

                <td>${p.broker}</td>
                <td class="num r">${p.qty_mt}</td>

              </tr>`).join('')}

  async pay(id, amount) {
    modal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head">Record payment <button class="btn btn-sm" onclick="closeModal()">✕</button></div>
        <div class="modal-body">
          <div class="form-row">
            <div class="form-field"><div class="form-label">Amount</div><input class="form-input" id="py-amt" type="number" value="${amount}"></div>
            <div class="form-field"><div class="form-label">Date</div><input class="form-input" id="py-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
          </div>
          <div class="form-row">
            <div class="form-field"><div class="form-label">Mode</div>
              <select class="form-select" id="py-mode">
                <option>neft</option><option>rtgs</option><option>upi</option><option>cheque</option><option>cash</option>
              </select>
            </div>
            <div class="form-field"><div class="form-label">Ref no.</div><input class="form-input" id="py-ref"></div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-success" onclick="pages['purchase-bills'].doPayment(${id})">Confirm payment</button>
        </div>
      </div>
    </div>`);
  },

  async doPayment(id) {
    try {
      await apiPost('/payments', {
        purchase_bill_id: id,
        amount:      parseFloat(document.getElementById('py-amt').value),
        payment_date: document.getElementById('py-date').value,
        payment_mode: document.getElementById('py-mode').value,
        reference_no: document.getElementById('py-ref').value||null,
      });
      closeModal(); toast('Payment recorded', 'ok');
      this.load();

  },

  exportSelected() {
    const ids = [...document.querySelectorAll('.pb-chk:checked')].map(c=>parseInt(c.value));

    window.open(`${API}/export/purchase-bills`, '_blank');

  async deletePB(id) {
    if (!confirm('Cancel this purchase bill?')) return;
    try {
      await apiFetch(`/purchase-bills/${id}`, { method: 'DELETE' });
      toast('Purchase bill cancelled', 'ok');
      this.load();
    } catch {}
  }
};

pages.market = {
  async load() {
    const el = document.getElementById('page-market');
    el.innerHTML = '<div class="loading">Loading</div>';
    document.getElementById('topbar-actions').innerHTML =
      `<button class="btn btn-primary" onclick="pages.market.openAdd()">+ Add price</button>`;
    try {
      const prices = await apiFetch('/market-prices?days=30');
      // Group by material
      const byMat = {};
      prices.forEach(p => { (byMat[p.material]||=[]).push(p); });
      el.innerHTML = Object.entries(byMat).map(([mat, rows]) => {
        const latest = rows[rows.length-1];
        const first  = rows[0];
        const change = latest && first ? ((latest.price_per_mt - first.price_per_mt) / first.price_per_mt * 100).toFixed(1) : null;
        return `<div class="tbl-wrap" style="margin-bottom:16px">
          <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
            <span class="pill ${matClass(mat)}">${mat}</span>
            ${latest?`<span class="num" style="font-size:16px">₹${parseFloat(latest.price_per_mt).toLocaleString('en-IN')}/MT</span>`:''}
            ${change!==null?`<span style="font-size:12px;color:${parseFloat(change)>=0?'var(--danger)':'var(--success)'}">${parseFloat(change)>=0?'+':''}${change}% (30d)</span>`:''}
          </div>
          <table class="tbl">
            <thead><tr><th>Date</th><th>Market</th><th class="r">Price/MT</th><th>Source</th><th></th></tr></thead>
            <tbody>
              ${rows.slice(-10).reverse().map(p=>`<tr>
                <td>${p.price_date}</td>
                <td>${p.market||'—'}</td>
                <td class="num r">₹${parseFloat(p.price_per_mt).toLocaleString('en-IN')}</td>
                <td><span class="pill pill-muted">${p.source}</span></td>
                <td><button class="btn btn-xs" onclick="pages.market.deletePrice(${p.id})" style="border-color:var(--danger);color:var(--danger)">Delete</button></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
      }).join('') || '<div class="loading">No market prices yet. Add some to help with tender bidding.</div>';
    } catch {}
  },

  openAdd() {
    const mats = state.materials.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
    modal(`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head">Add market price <button class="btn btn-sm" onclick="closeModal()">✕</button></div>
        <div class="modal-body">
          <div class="form-row">
            <div class="form-field"><div class="form-label">Material</div><select class="form-select" id="mp-mat">${mats}</select></div>
            <div class="form-field"><div class="form-label">Date</div><input class="form-input" type="date" id="mp-date" value="${new Date().toISOString().slice(0,10)}"></div>
          </div>
          <div class="form-row">
            <div class="form-field"><div class="form-label">Price (₹/MT)</div><input class="form-input" type="number" id="mp-price"></div>
            <div class="form-field"><div class="form-label">Market / mandi</div><input class="form-input" id="mp-market" placeholder="Jodhpur Mandi"></div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="pages.market.save()">Save</button>
        </div>
      </div>
    </div>`);
  },

  async save() {
    try {
      await apiPost('/market-prices', {
        material_id:  parseInt(document.getElementById('mp-mat').value),
        price_date:   document.getElementById('mp-date').value,
        price_per_mt: parseFloat(document.getElementById('mp-price').value),
        market:       document.getElementById('mp-market').value||null,
      });
      closeModal(); toast('Price saved', 'ok');
      this.load();
    } catch {}
  },

  async deletePrice(id) {
    if (!confirm('Delete this price entry?')) return;
    try {
      await apiFetch(`/market-prices/${id}`, { method: 'DELETE' });
      toast('Price deleted', 'ok');
      this.load();
    } catch {}
  }
};

        <div class="modal-head">Add broker <button class="btn btn-sm" onclick="closeModal()">✕</button></div>

          <button class="btn btn-primary" onclick="pages.brokers.save()">Save</button>
